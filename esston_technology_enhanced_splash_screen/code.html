<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>Esston Technology - Splash Screen</title>
<!-- Tailwind CSS CDN with forms and container queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Inter and Montserrat for crisp corporate & tech typography -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,600;0,700;0,800;0,900;1,700;1,800&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            montserrat: ['Montserrat', 'sans-serif'],
          },
          colors: {
            brand: {
              orange: '#FF6B00',
              orangeLight: '#FF8A00',
              orangeDark: '#D45A0E',
              navy: '#0B192C',
              navyLight: '#1E3E62',
              navyDark: '#071827',
              slate: '#506677'
            }
          }
        }
      }
    }
  </script>
<!-- BEGIN: Custom Keyframe & Brand Styles -->
<style data-purpose="animations">
    @keyframes subtleFloat {
      0%, 100% {
        transform: translateY(0px) scale(1);
      }
      50% {
        transform: translateY(-6px) scale(1.012);
      }
    }

    @keyframes pulseGaze {
      0%, 100% {
        opacity: 0.4;
        transform: scale(0.96);
      }
      50% {
        opacity: 0.8;
        transform: scale(1.06);
      }
    }

    @keyframes waveShimmer {
      0%, 100% {
        transform: translate3d(0, 0, 0) scale(1);
      }
      50% {
        transform: translate3d(5px, -5px, 0) scale(1.015);
      }
    }

    @keyframes techNodePulse {
      0%, 100% {
        opacity: 0.35;
        transform: scale(0.9);
      }
      50% {
        opacity: 1;
        transform: scale(1.35);
      }
    }

    @keyframes circuitFlow {
      0% {
        stroke-dashoffset: 80;
      }
      100% {
        stroke-dashoffset: 0;
      }
    }

    @keyframes auroraDrift {
      0%, 100% {
        transform: translate(0, 0) scale(1);
        opacity: 0.45;
      }
      50% {
        transform: translate(-15px, 12px) scale(1.12);
        opacity: 0.75;
      }
    }

    @keyframes spinLinear {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes pulseDot {
      0%, 80%, 100% {
        opacity: 0.2;
        transform: scale(0.85);
      }
      40% {
        opacity: 1;
        transform: scale(1.15);
      }
    }

    @keyframes progressGlow {
      0% {
        width: 12%;
        left: 0%;
      }
      50% {
        width: 45%;
        left: 30%;
      }
      100% {
        width: 12%;
        left: 88%;
      }
    }

    .animate-float-badge {
      animation: subtleFloat 4.6s ease-in-out infinite;
    }

    .animate-ambient-glow {
      animation: pulseGaze 5s ease-in-out infinite;
    }

    .animate-wave-subtle {
      animation: waveShimmer 8s ease-in-out infinite;
    }

    .animate-aurora-drift {
      animation: auroraDrift 9s ease-in-out infinite;
    }

    .animate-custom-spin {
      animation: spinLinear 1.1s linear infinite;
    }

    .animate-node-pulse {
      animation: techNodePulse 3s ease-in-out infinite;
    }

    .circuit-animated-line {
      stroke-dasharray: 6 10;
      animation: circuitFlow 5s linear infinite;
    }

    .loading-dot-1 {
      animation: pulseDot 1.4s infinite ease-in-out;
      animation-delay: 0s;
    }
    .loading-dot-2 {
      animation: pulseDot 1.4s infinite ease-in-out;
      animation-delay: 0.2s;
    }
    .loading-dot-3 {
      animation: pulseDot 1.4s infinite ease-in-out;
      animation-delay: 0.4s;
    }

    .progress-beam {
      animation: progressGlow 2.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
  </style>
<style data-purpose="background-mesh">
    .tech-grid-pattern {
      background-size: 26px 26px;
      background-image: 
        radial-gradient(circle, rgba(14, 41, 66, 0.08) 1.2px, transparent 1.2px);
    }
    .tech-circuit-grid {
      background-size: 52px 52px;
      background-image:
        linear-gradient(to right, rgba(14, 41, 66, 0.035) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(14, 41, 66, 0.035) 1px, transparent 1px);
    }
    .safe-screen-container {
      min-height: 100dvh;
      width: 100vw;
    }
  </style>
<!-- END: Custom Keyframe & Brand Styles -->
</head>
<body class="h-full bg-slate-900 font-sans antialiased text-slate-800 m-0 p-0 flex items-center justify-center select-none overflow-hidden">
<!-- BEGIN: MainMobileContainer -->

<script id="esston-global-navigation">
(function(){
 const R={home:'customer-home.html',dashboard:'dealer-dashboard.html',products:'catalogue.html',dealerproducts:'dealer-catalogue.html',details:'product-details.html',starter:'my-starter.html',control:'motor-control.html',schedule:'schedule.html',faq:'help-faq.html',enquiry:'contact-enquiry.html',auth:'auth.html',splash:'splash.html',otp:'dealer-otp.html',dealerEnquiries:'dealer-enquiries.html'};
 const p=(location.pathname.split('/').pop()||'index.html').toLowerCase();
 const isDealer=/dealer-dashboard|dealer-catalogue|dealer-enquiries/.test(p);
 const go=(key)=>{if(R[key]) location.href=R[key];};
 const txt=e=>(e.innerText||e.textContent||'').replace(/\s+/g,' ').trim().toLowerCase();
 // Route the existing bottom navigation and clearly named action buttons to the corresponding screens.
 document.addEventListener('click',function(ev){
   const el=ev.target.closest('a,button,[role="button"]'); if(!el) return;
   const t=txt(el); const page=p;
   // Common bottom/navigation links
   if(/^(home|dashboard)$/.test(t) || t.startsWith('home ')){ev.preventDefault();go(isDealer?'dashboard':'home');return;}
   if(t==='products' || t.includes('browse products') || t.includes('view products') || t==='all products' || t==='product catalogue'){ev.preventDefault();go(isDealer?'dealerproducts':'products');return;}
   if(t==='enquiry' || t==='enquiries' || t.includes('my enquiries') || t.includes('recent enquiries') || t.includes('view all enquiries')){ev.preventDefault();go(isDealer?'dealerEnquiries':'enquiry');return;}
   if(t==='faqs' || t==='help & faq' || t==='help & support' || t.includes('chat with faq bot') || t.includes('need help')){ev.preventDefault();go('faq');return;}
   if(t==='motor control' || t==='control' || t.includes('check status') || t.includes('tap to start motor')){ if(!/motor_control|motor-control/.test(page)){ev.preventDefault();go('control');return;} }
   if(t==='my starter' || t.includes('view my starter') || t.includes('starter details')){ev.preventDefault();go('starter');return;}
   if(t.includes('motor schedule') || t.includes('set schedule') || t==='add slot' || t.includes('auto timer schedule')){ev.preventDefault();go('schedule');return;}
   if(t==='view details' || t==='view product details' || t.includes('product details')){ev.preventDefault();go('details');return;}
   if(t.includes('send enquiry') || t.includes('add to enquiry') || t==='submit enquiry' || t==='contact support' || t==='contact / enquiry'){ev.preventDefault();go('enquiry');return;}
   if(t.includes('dealer b2b portal')){ev.preventDefault();go('auth');return;}
   if(t.includes('customer iot app')){ev.preventDefault();go('auth');return;}
   // Splash screen progresses to role selection when user taps the page.
   if(page==='splash.html' && !el.closest('a[href^="http"]')){ev.preventDefault();go('auth');return;}
   // Login: customer enters customer home; dealer login enters the OTP screen.
   if(page==='auth.html' && (t.includes('login') || t.includes('continue'))){
     const dealer=!!el.closest('section,form,div') && (el.closest('section,form,div').innerText||'').toLowerCase().includes('dealer login');
     if(dealer || t.includes('dealer')){ev.preventDefault();go('otp');return;}
     if(t.includes('login')){ev.preventDefault();go('home');return;}
   }
   if(page==='dealer-dashboard.html' && (t.includes('share quote') || t.includes('quick order'))){ev.preventDefault();go('dealerEnquiries');return;}
 },true);
 // Make all placeholder bottom-nav links meaningful even when their labels are nested in icon wrappers.
 document.querySelectorAll('a[href="#"]').forEach(a=>{
   const t=txt(a);
   if(t==='home') a.href=R.home; else if(t==='dashboard') a.href=R.dashboard; else if(t==='products') a.href=isDealer?R.dealerproducts:R.products; else if(t==='motor control'||t==='control') a.href=R.control; else if(t==='my starter') a.href=R.starter; else if(t==='faqs'||t==='help & faq') a.href=R.faq; else if(t==='enquiry'||t==='enquiries') a.href=isDealer?R.dealerEnquiries:R.enquiry; else if(t==='more') a.href=R.faq;
 });
})();
</script>
